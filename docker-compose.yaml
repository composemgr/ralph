# nginx proxy address - http://172.17.0.1:8073

name: ralph
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "1"

services:
  ralph:
    image: allegro/ralph:latest
    pull_policy: always
    container_name: ralph-app
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    logging: *default-logging
    networks:
      - ralph
      - proxy
      - cloudflare
    ports:
      - "172.17.0.1:8073:8000"
    environment:
      TZ: ${TZ:-America/New_York}
      DATABASE_NAME: ${DB_CREATE_DATABASE_NAME:-ralph}
      DATABASE_USER: ${DB_USER_NAME:-ralph}
      DATABASE_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
      DATABASE_HOST: ralph-db
      DATABASE_PORT: 5432
      REDIS_HOST: ralph-redis
      REDIS_PORT: 6379
      SECRET_KEY: ${APP_SECRET_KEY:-changeme_secret_key_min_32_chars}
      ALLOWED_HOSTS: ${BASE_HOST_NAME:-localhost}.${BASE_DOMAIN_NAME:-example.com},localhost
      SUPERUSER_NAME: ${APP_ADMIN_USER:-admin}
      SUPERUSER_EMAIL: ${APP_ADMIN_USER:-admin@example.com}
      SUPERUSER_PASSWORD: ${APP_ADMIN_PASS:-changeme_admin_password}
      EMAIL_HOST: ${EMAIL_SERVER_HOST:-localhost}
      EMAIL_PORT: ${EMAIL_SERVER_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_SERVER_LOGIN_NAME:-""}
      EMAIL_HOST_PASSWORD: ${EMAIL_SERVER_LOGIN_PASS:-""}
      EMAIL_FROM: ${EMAIL_SERVER_MAIL_FROM:-noreply@example.com}
      CONTAINER_NAME: ralph-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    depends_on:
      ralph-db:
        condition: service_healthy
      ralph-redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - 'traefik.enable=true'
      - 'cloudflare.enable=true'
      - 'traefik.docker.network=proxy'
      - 'cloudflare.service=http://ralph-app:8000'
      - 'cloudflare.hostname=ralph.${CLOUDFLARE_ZONE_NAME:-}'
      - 'traefik.http.routers.ralph-app.entrypoints=http'
      - 'traefik.http.routers.ralph-app-secure.tls=true'
      - 'traefik.http.routers.ralph-app.rule=Host($(${BASE_HOST_NAME:-$HOSTNAME}))'
      - 'traefik.http.middlewares.ralph-app-https-redirect.redirectscheme.scheme=https'
      - 'traefik.http.routers.ralph-app.middlewares=ralph-app-https-redirect'
      - 'traefik.http.routers.ralph-app-secure.entrypoints=https'
      - 'traefik.http.routers.ralph-app-secure.rule=Host($(${BASE_HOST_NAME:-$HOSTNAME}))'
      - 'traefik.http.routers.ralph-app-secure.tls.certresolver=cloudflare'
      - 'traefik.http.routers.ralph-app-secure.service=ralph-app'
      - 'traefik.http.services.ralph-app.loadbalancer.server.port=8000'

  ralph-db:
    image: postgres:latest
    pull_policy: always
    container_name: ralph-db
    restart: always
    logging: *default-logging
    networks:
      - ralph
    environment:
      TZ: ${TZ:-America/New_York}
      POSTGRES_DB: ${DB_CREATE_DATABASE_NAME:-ralph}
      POSTGRES_USER: ${DB_USER_NAME:-ralph}
      POSTGRES_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
      CONTAINER_NAME: ralph-db
    volumes:
      - ./volumes/data/db/postgres/ralph:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER_NAME:-ralph} -d ${DB_CREATE_DATABASE_NAME:-ralph}"]
      interval: 30s
      timeout: 10s
      retries: 3

  ralph-redis:
    image: redis:alpine
    pull_policy: always
    container_name: ralph-redis
    restart: always
    logging: *default-logging
    networks:
      - ralph
    environment:
      CONTAINER_NAME: ralph-redis
    volumes:
      - ./volumes/data/db/redis/ralph:/data

networks:
  ralph:
    name: ralph
    external: false
  proxy:
    external: true
  cloudflare:
    external: true
